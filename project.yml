name: Echo
options:
  bundleIdPrefix: com.jeffhobbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YKF353373Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 6
    # Universal: Apple Silicon and Intel.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    # Debug builds only the machine's own slice, so iterating stays quick;
    # anything shipped is built for both.
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      ONLY_ACTIVE_ARCH: "NO"
targets:
  Echo:
    type: application
    platform: macOS
    sources:
      - App
      - Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Jeff Hobbs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.echo
